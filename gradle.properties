# ============================================================
#  Brother in Blocks - Configuracion del proyecto
#  Mod de Minecraft 1.20.1 para Forge
# ============================================================

# Memoria para Gradle (necesaria para descompilar Minecraft)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# IMPORTANTE: JDK 17 ubicado en el disco Database
# (el disco del sistema no tiene espacio para instalar otro)
org.gradle.java.home=/media/angel/Database/dev/jdk-17

## Environment Properties

# La version de Minecraft debe coincidir con la version de Forge
minecraft_version=1.20.1
# Rango de versiones de Minecraft aceptado
minecraft_version_range=[1.20.1,1.21)
# Version de Forge (47.4.22 es la mas reciente para 1.20.1)
forge_version=47.4.22
# Rango de versiones de Forge aceptado
forge_version_range=[47,)
# El rango del loader solo puede usar la version mayor de Forge/FML
loader_version_range=[47,)
# Canales de mapeo: "official" usa los nombres oficiales de Mojang
mapping_channel=official
mapping_version=1.20.1

## Mod Properties

# Identificador unico del mod (minusculas, sin espacios)
mod_id=brotherinblocks
# Nombre visible del mod
mod_name=Brother in Blocks
# Licencia del mod
mod_license=All Rights Reserved
# Version del mod (semver)
mod_version=2.0.3
# Grupo/paguete base de Java
mod_group_id=com.brotherinblocks
# Autor
mod_authors=Angel
# Descripcion del mod
mod_description=Tu companero de Minecraft: un amigo con IA que juega contigo en singleplayer como si fuera multijugador. v2.0.1: nucleo del sistema de tareas (Task, TaskChain, TaskRunner) reimplementado.
